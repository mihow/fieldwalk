name: FieldWalk
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"

packages:
  CoreGPX:
    url: https://github.com/vincentneo/CoreGPX.git
    from: "0.9.0"

targets:
  FieldWalk:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: SupportingFiles/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FieldWalk
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "FieldWalk records your path during surveys."
        INFOPLIST_KEY_NSCameraUsageDescription: "FieldWalk uses the camera to capture observation photos."
        INFOPLIST_KEY_UIBackgroundModes: location
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    dependencies:
      - package: CoreGPX

  FieldWalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/FieldWalkTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: FieldWalk
